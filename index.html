<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gran Rifa de Celulares</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .price { font-size: 1.2rem; font-weight: bold; color: #16a34a; background: #dcfce7; padding: 6px 12px; border-radius: 15px; display: inline-block; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 15px; }
        .num-btn { padding: 12px 0; border: 2px solid #cbd5e1; background: white; border-radius: 8px; font-weight: bold; font-size: 1rem; }
        .num-btn.selected { background: #2563eb; color: white; border-color: #2563eb; }
        .pay-info { background: #eff6ff; padding: 12px; border-radius: 8px; text-align: left; margin: 15px 0; font-size: 0.95rem; }
        .btn-ws { width: 100%; background: #25d366; color: white; border: none; padding: 15px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2> Gran Rifa de Celular </h2>
    <p>¡Gana un teléfono completamente nuevo!</p>
    <p><span class="price">Precio: $4.00 </span></p>
</div>

<div class="card">
    <h3> Elige tus números</h3>
    <div class="grid" id="grid"></div>
</div>

<div class="card">
    <h3> Paga y confirma</h3>
    <div class="pay-info">
        <strong>Binance - Zelle - Pago Movil:</strong><br>
        
   
    </div>
    <button class="btn-ws" onclick="enviarWhatsApp()">Reservar por WhatsApp</button>
</div>

<script>
    const seleccionados = new Set();
    const grid = document.getElementById('grid');

    for (let i = 0; i < 100; i++) {
        const num = String(i).padStart(2, '0');
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = num;
        btn.onclick = () => {
            if (seleccionados.has(num)) {
                seleccionados.delete(num);
                btn.classList.remove('selected');
            } else {
                seleccionados.add(num);
                btn.classList.add('selected');
            }
        };
        grid.appendChild(btn);
    }

    function enviarWhatsApp() {
        if (seleccionados.size === 0) return alert("Selecciona al menos un número");
        const lista = Array.from(seleccionados).sort().join(', ');
        const numeroTelefono = "584127881727"; // Pon tu número aqu
        const msg = `¡Hola! Quiero reservar los números: *${lista}* para la rifa del celular. Voy a pagar con.`;
        window.open(`https://wa.me/${numeroTelefono}?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>

</body>
</html>
